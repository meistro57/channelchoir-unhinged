# filename: choir.unhinged.example.yaml
# Copy to choir.yaml, fill secrets from the environment, and run with:
#   /usr/local/go/bin/go build -o choir ./cmd/choir   (or: make build)
#
# UNHINGED = unpredictable conversation in a DISPOSABLE test cell, NOT
# uncontrolled infrastructure. Every "unhinged" dial below still sits behind a
# hard safety layer at the bottom. Read that block before you loosen anything.

discord:
  bot_token: ${DISCORD_BOT_TOKEN}       # read-only; voices post via webhooks
  guild_id: "1572664667455619175"   # lab guild (pin this for live deployment)
  channel_id: "1572998079291068437" # choir-test-cell (Firing Range)
  poll_seconds: 2
  allowed_channels:                     # MANDATORY. UNHINGED refuses to start
    - "1572998079291068437"            # without an explicit allowlist.
  allowed_guilds:                       # optional: pin to the lab guild
    - "1572664667455619175"

ollama:
  base_url: http://localhost:11434
  model: dolphin-mistral:latest
  temperature: 1.2
  num_predict: 80
  timeout_seconds: 120

conductor:
  persona_dir: personas
  transcript_size: 30
  max_verse: -1           # (2) -1 = infinite, no verse cap
  rest_seconds: 0         # (5) never rest
  cooldown_turns: 0       # (3) a voice may reply to itself
  min_delay_seconds: 0    # (6) near-zero delay
  max_delay_seconds: 1
  speak_threshold: -1.0   # (4) everyone always answers
  voices_per_tick: -1     # (1) ALL eligible voices speak, not one winner
  bot_to_bot: true        # allow choir echoes to trigger further replies
  mode: autonomous        # autonomous | human_gated
  recent_responses: 20    # bounded dedup history (0 = off)
  trigger_weight: 0.35
  direct_address_boost: 2.0
  jitter: 0.4
  burst:                  # (8) rate-limit stress
    enabled: false
    count: 10
    window_millis: 1000

safeguards:
  max_messages_per_run: 500      # process-lifetime absolute ceiling
  max_messages_per_session: 50   # per-conversation budget (resets on human)
  max_messages_per_minute: 20    # post rate cap inside a session
  max_runtime_seconds: 3600
  kill_switch_path: kill-switch

controls:
  enabled: false            # turn on !choir only after wiring an operator surface
  prefix: "!choir"
  operators:                # Discord user IDs allowed to run control commands
    - "292072807553302529"  # Meistro / Mark
  control_webhook_url: ""   # DEDICATED control webhook (never a persona webhook); empty = log-only
